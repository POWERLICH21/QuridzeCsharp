<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kumo Threads | Original anime-inspired apparel</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <div class="topbar">
    <div class="wrap topbar-in">
      <span id="ship-note">Free shipping on bigger orders</span>
      <nav>
        <a href="#/about">About</a><a href="#/faq">FAQ</a><a href="#/wishlist">Wishlist</a>
        <a href="#/track">Track order</a><a href="#/contact">Contact</a>
      </nav>
    </div>
  </div>

  <header class="header">
    <div class="wrap header-in">
      <a class="logo" href="#/"><span class="logo-mark">雲</span>KUMO<b>THREADS</b></a>
      <form id="search" class="search" role="search">
        <input name="q" type="search" placeholder="Search hoodies, shorts, jerseys…" aria-label="Search products">
        <button type="submit" aria-label="Search">Search</button>
      </form>
      <div class="header-actions">
        <a href="#/account" id="account-link">Account</a>
        <button id="cart-btn" class="cart-btn" type="button">Cart <span id="cart-count">0</span></button>
      </div>
    </div>
    <nav class="catnav"><div class="wrap" id="catnav"></div></nav>
  </header>

  <main id="view" class="wrap"></main>

  <footer class="footer">
    <div class="wrap footer-in">
      <div>
        <a class="logo" href="#/"><span class="logo-mark">雲</span>KUMO<b>THREADS</b></a>
        <p>Original anime-inspired apparel, printed in small batches.</p>
      </div>
      <div><h4>Shop</h4><a href="#/shop?trending=1">Trending</a><a href="#/shop?isNew=1">New in</a><a href="#/shop?sale=1">Sale</a><a href="#/shop">All products</a></div>
      <div><h4>Help</h4><a href="#/faq">FAQ</a><a href="#/track">Track your order</a><a href="#/contact">Contact us</a><a href="#/about">About us</a></div>
      <div>
        <h4>Newsletter</h4>
        <form id="newsletter" class="inline-form">
          <input type="email" name="email" placeholder="you@example.com" required aria-label="Email">
          <button class="btn" type="submit">Join</button>
        </form>
        <p id="newsletter-msg" class="muted"></p>
      </div>
    </div>
    <div class="wrap footer-note">Demo shop. No real payments are taken.</div>
  </footer>

  <div id="overlay" class="overlay" hidden></div>
  <aside id="drawer" class="drawer" aria-label="Cart" hidden></aside>
  <div id="toast" class="toast" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
